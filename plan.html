<script>
(() => {
  const sealed = JSON.parse(document.getElementById('sealed').textContent);
  const bytes = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
  const NAME = 'cuvo-sandbox-key';
  const form = document.getElementById('lock'), no = document.getElementById('no');
  const kept = () => { try { return sessionStorage.getItem(NAME) || localStorage.getItem(NAME); } catch { return null; } };
  const keep = (key, always) => { try { sessionStorage.setItem(NAME, key); if (always) localStorage.setItem(NAME, key); } catch {} };
  const forget = () => { try { sessionStorage.removeItem(NAME); localStorage.removeItem(NAME); } catch {} };

  async function keyFrom(password) {
    const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(sealed.salt), iterations: sealed.rounds }, raw, 256);
    return btoa(String.fromCharCode(...new Uint8Array(bits)));
  }
  async function open(key) {
    const data = bytes(sealed.page);
    const aes = await crypto.subtle.importKey('raw', bytes(key), 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.subarray(0, 12) }, aes, data.subarray(12)));
  }
  function show(page) {
    const at = location.hash;
    document.open(); document.write(page); document.close();
    // the page was written after the address was read: point at the same place again
    if (at) { history.replaceState(null, '', location.pathname + location.search); location.hash = at; }
  }

  // A page written while this one is still being read is added under the form, not put in its
  // place. So the kept key waits for the end of the read, and the form stays out of sight meanwhile.
  const read = new Promise(done => {
    const after = () => setTimeout(done, 0);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', after, { once: true });
    else after();
  });
  const main = document.querySelector('main');
  const before = kept();
  if (before) {
    main.hidden = true;
    Promise.all([open(before), read]).then(([page]) => show(page), () => { forget(); main.hidden = false; });
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true; no.hidden = true;
    try {
      const key = await keyFrom(document.getElementById('pw').value);
      const page = await open(key);
      keep(key, document.getElementById('keep').checked);
      show(page);
    } catch {
      no.hidden = false; button.disabled = false;
      document.getElementById('pw').select();
    }
  });
})();
</script>
